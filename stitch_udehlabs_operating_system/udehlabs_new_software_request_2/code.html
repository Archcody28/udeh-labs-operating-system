<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Software Request Wizard - Nexus AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#690005",
                        "on-tertiary-container": "#b8e0ff",
                        "background": "#031427",
                        "surface-container-low": "#0b1c30",
                        "primary": "#c3c0ff",
                        "primary-container": "#4f46e5",
                        "tertiary-fixed-dim": "#89ceff",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "surface-container": "#102034",
                        "error": "#ffb4ab",
                        "on-tertiary": "#00344d",
                        "outline-variant": "#464555",
                        "secondary-container": "#571bc1",
                        "on-tertiary-fixed": "#001e2f",
                        "inverse-on-surface": "#213145",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-background": "#d3e4fe",
                        "error-container": "#93000a",
                        "on-primary-container": "#dad7ff",
                        "surface-container-lowest": "#000f21",
                        "inverse-primary": "#4d44e3",
                        "secondary-fixed": "#e9ddff",
                        "surface-container-highest": "#26364a",
                        "tertiary-fixed": "#c9e6ff",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-surface-variant": "#c7c4d8",
                        "outline": "#918fa1",
                        "surface-tint": "#c3c0ff",
                        "on-secondary-fixed-variant": "#5516be",
                        "tertiary": "#89ceff",
                        "surface-variant": "#26364a",
                        "inverse-surface": "#d3e4fe",
                        "secondary": "#d0bcff",
                        "on-error-container": "#ffdad6",
                        "on-primary": "#1d00a5",
                        "surface-bright": "#2a3a4f",
                        "primary-fixed": "#e2dfff",
                        "on-surface": "#d3e4fe",
                        "on-secondary": "#3c0091",
                        "tertiary-container": "#006693",
                        "on-primary-fixed": "#0f0069",
                        "surface-container-high": "#1b2b3f",
                        "secondary-fixed-dim": "#d0bcff",
                        "surface": "#031427",
                        "surface-dim": "#031427",
                        "on-secondary-fixed": "#23005c",
                        "on-secondary-container": "#c4abff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sm": "8px",
                        "base": "4px",
                        "lg": "24px",
                        "sidebar_collapsed": "64px",
                        "2xl": "48px",
                        "sidebar_width": "260px",
                        "xs": "4px",
                        "xl": "32px",
                        "max_content_width": "1440px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display": ["Inter"],
                        "body-md": ["Inter"],
                        "code-sm": ["JetBrains Mono"],
                        "code-md": ["JetBrains Mono"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "code-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "code-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Level 1 Card styling based on design system */
        .card-level-1 {
            background-color: #0F172A;
            border: 1px solid #1E293B;
        }
        
        /* Subtle glow for active focus/AI */
        .ai-glow-focus:focus-within {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
            border-color: #8B5CF6;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">
<!-- Active Navigation Logic: "New Request" is active (transactional flow, but sidebar provided in blueprint). 
         Wait, intent is "transactional flow" so "Automatic Suppression" rule says exclude nav shell. 
         Wait, if the rule is "exclude navigation shell if intent is linear/transactional: Login, Onboarding... guided wizard", then I MUST NOT render the SideNav or TopAppBar.
         Let me re-read: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login, Sign-up, Onboarding, Checkout, or "Success/Confirmation" splash screens. Task-Focused: Any sub-page featuring a "Close" or "Back" action that implies a temporary departure from the main navigation flow."
         Wizard is a guided transactional flow. So suppress the shell. 
    -->
<!-- Main Workspace - Full width due to suppressed shell -->
<main class="w-full h-screen overflow-y-auto flex flex-col items-center p-md md:p-xl lg:p-2xl">
<div class="w-full max-w-[1000px] flex flex-col gap-xl">
<!-- Header & Stepper -->
<header class="w-full flex flex-col gap-lg pb-md border-b border-outline-variant">
<div class="flex justify-between items-center">
<div>
<h1 class="font-headline-lg text-headline-lg text-primary">New Software Request</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Complete the technical specifications to initialize the project architecture.</p>
</div>
<div class="flex gap-sm">
<button class="px-md py-sm rounded border border-outline-variant text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition-colors font-body-md text-body-md flex items-center gap-sm">
<span class="material-symbols-outlined text-[18px]">save</span>
                            Save Draft
                        </button>
<button class="px-md py-sm rounded border border-outline-variant text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition-colors font-body-md text-body-md flex items-center gap-sm">
<span class="material-symbols-outlined text-[18px]">close</span>
                            Cancel
                        </button>
</div>
</div>
<!-- Stepper -->
<div class="flex items-center justify-between relative mt-md">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[1px] bg-outline-variant -z-10"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-[25%] h-[1px] bg-primary -z-10 transition-all duration-300"></div>
<div class="flex flex-col items-center gap-sm bg-background px-sm">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary font-label-caps text-label-caps shadow-[0_0_15px_rgba(139,92,246,0.3)]">1</div>
<span class="font-label-caps text-label-caps text-primary">Idea &amp; Problem</span>
</div>
<div class="flex flex-col items-center gap-sm bg-background px-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center text-on-surface-variant font-label-caps text-label-caps">2</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Target Users</span>
</div>
<div class="flex flex-col items-center gap-sm bg-background px-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center text-on-surface-variant font-label-caps text-label-caps">3</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Reqs &amp; Features</span>
</div>
<div class="flex flex-col items-center gap-sm bg-background px-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center text-on-surface-variant font-label-caps text-label-caps">4</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Platforms &amp; Time</span>
</div>
<div class="flex flex-col items-center gap-sm bg-background px-sm">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center text-on-surface-variant font-label-caps text-label-caps">5</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Review</span>
</div>
</div>
</header>
<!-- Step Content: Idea & Problem -->
<div class="w-full flex flex-col gap-lg animate-fade-in">
<div class="card-level-1 rounded-lg p-lg flex flex-col gap-lg shadow-sm">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-outline-variant pb-sm">1. Idea &amp; Problem Definition</h2>
<div class="flex flex-col gap-sm ai-glow-focus rounded transition-all">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs" for="project-name">
<span class="material-symbols-outlined text-[14px]">terminal</span>
                            Project Codename
                        </label>
<input class="bg-surface-container-lowest border border-outline-variant rounded px-md py-sm font-code-md text-code-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-full" id="project-name" placeholder="e.g. Project Nova" type="text"/>
</div>
<div class="flex flex-col gap-sm ai-glow-focus rounded transition-all">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs" for="problem-statement">
<span class="material-symbols-outlined text-[14px]">psychology</span>
                            Core Problem Statement
                        </label>
<p class="font-body-sm text-[12px] text-on-surface-variant mb-xs">Describe the specific pain point this software will resolve.</p>
<textarea class="bg-surface-container-lowest border border-outline-variant rounded px-md py-sm font-code-md text-code-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-full resize-y" id="problem-statement" placeholder="Currently, process X takes Y time due to manual step Z..." rows="4"></textarea>
</div>
<div class="flex flex-col gap-sm ai-glow-focus rounded transition-all">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs" for="proposed-solution">
<span class="material-symbols-outlined text-[14px]">lightbulb</span>
                            Proposed Solution Architecture
                        </label>
<textarea class="bg-surface-container-lowest border border-outline-variant rounded px-md py-sm font-code-md text-code-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-full resize-y" id="proposed-solution" placeholder="A cloud-native microservices architecture utilizing..." rows="4"></textarea>
</div>
</div>
<!-- Navigation Buttons -->
<div class="flex justify-between items-center mt-md">
<button class="px-lg py-sm rounded border border-outline-variant text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition-colors font-body-md text-body-md flex items-center gap-sm opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                        Previous Step
                    </button>
<button class="px-lg py-sm rounded bg-primary-container text-on-primary-container hover:bg-inverse-primary transition-colors font-body-md text-body-md font-bold flex items-center gap-sm shadow-[0_4px_12px_rgba(79,70,229,0.2)]">
                        Next: Target Users
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<style>
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
