</button>

                    Submit Request

</button>

<script>
        let currentStep = 1;
        const totalSteps = 3;

        function updateUI() {
            // Update Progress Bar
            const progress = ((currentStep - 1) / (totalSteps - 1)) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Update Circles and Text
            for (let i = 1; i <= totalSteps; i++) {
                const circle = document.getElementById(`step-${i}-circle`);
                const text = document.getElementById(`step-${i}-text`);
                
                if (i < currentStep) {
                    // Completed
                    circle.className = 'w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-headline-md text-headline-md shadow-sm transition-all duration-300 border-2 border-transparent';
                    circle.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span>';
                    text.className = 'mt-sm font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase transition-colors';
                } else if (i === currentStep) {
                    // Current
                    circle.className = 'w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center font-headline-md text-headline-md shadow-sm transition-all duration-300 border-2 border-transparent';
                    circle.innerHTML = i;
                    text.className = 'mt-sm font-label-caps text-label-caps text-primary tracking-wider uppercase transition-colors font-bold';
                } else {
                    // Future
                    circle.className = 'w-10 h-10 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center font-headline-md text-headline-md shadow-sm border-2 border-surface-container-high transition-all duration-300';
                    circle.innerHTML = i;
                    text.className = 'mt-sm font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase transition-colors';
                }
            }

            // Update Content Visibility
            for (let i = 1; i <= totalSteps; i++) {
                const content = document.getElementById(`step-${i}-content`);
                if (i === currentStep) {
                    content.classList.remove('hidden');
                    // Small delay to allow display:block to apply before fading in
                    setTimeout(() => {
                        content.classList.add('opacity-100');
                        content.classList.remove('opacity-0');
                    }, 50);
                } else {
                    content.classList.add('hidden', 'opacity-0');
                    content.classList.remove('opacity-100');
                }
            }

            // Update Buttons
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-btn');

            if (currentStep === 1) {
                prevBtn.classList.add('invisible');
            } else {
                prevBtn.classList.remove('invisible');
            }

            if (currentStep === totalSteps) {
                nextBtn.classList.add('hidden');
                submitBtn.classList.remove('hidden');
            } else {
                nextBtn.classList.remove('hidden');
                submitBtn.classList.add('hidden');
            }
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateUI();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateUI();
            }
        }

        function goToStep(step) {
            // Optional: Add validation logic here before allowing jump
            if (step >= 1 && step <= totalSteps) {
                currentStep = step;
                updateUI();
            }
        }

        function submitForm() {
            // Simulate form submission
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">sync</span> Processing...';
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            setTimeout(() => {
                alert('Onboarding request submitted successfully!');
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                // Reset form optionally
                // currentStep = 1; updateUI();
            }, 1500);
        }

        // Initialize UI
        updateUI();
    </script>
