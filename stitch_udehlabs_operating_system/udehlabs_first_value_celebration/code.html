<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Success Milestone - UdehLabs</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#571bc1",
                        "on-primary-fixed": "#0f0069",
                        "secondary": "#d0bcff",
                        "on-primary-fixed-variant": "#3323cc",
                        "tertiary-fixed": "#c9e6ff",
                        "on-tertiary": "#00344d",
                        "on-background": "#d3e4fe",
                        "on-primary-container": "#dad7ff",
                        "on-secondary-fixed": "#23005c",
                        "secondary-fixed-dim": "#d0bcff",
                        "on-tertiary-fixed": "#001e2f",
                        "on-error": "#690005",
                        "surface-glass": "rgba(30, 41, 59, 0.7)",
                        "surface-container-low": "#0b1c30",
                        "text-on-surface": "#d3e4fe",
                        "inverse-on-surface": "#213146",
                        "on-secondary-container": "#c4abff",
                        "on-primary": "#1d00a5",
                        "inverse-primary": "#4d44e3",
                        "primary-container": "#4f46e5",
                        "surface-bright": "#2a3a4f",
                        "inverse-surface": "#d3e4fe",
                        "outline": "#918fa1",
                        "primary-fixed-dim": "#c3c0ff",
                        "primary": "#c3c0ff",
                        "surface-variant": "#26364a",
                        "border-muted": "#464555",
                        "background": "#031427",
                        "surface-dim": "#031427",
                        "outline-variant": "#464555",
                        "activation-glow": "rgba(139, 92, 246, 0.25)",
                        "primary-fixed": "#e2dfff",
                        "secondary-fixed": "#e9ddff",
                        "on-surface-variant": "#c7c4d8",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#89ceff",
                        "on-tertiary-container": "#b8e0ff",
                        "tertiary": "#89ceff",
                        "surface-tint": "#c3c0ff",
                        "surface": "#031427",
                        "on-secondary-fixed-variant": "#5516be",
                        "surface-container-lowest": "#000f21",
                        "error-container": "#93000a",
                        "surface-container": "#102034",
                        "success-vibrant": "#10b981",
                        "error": "#ffb4ab",
                        "on-secondary": "#3c0091",
                        "surface-container-highest": "#26364a",
                        "tertiary-container": "#006693",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "on-surface": "#d3e4fe",
                        "surface-container-high": "#1b2b3f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "max-content-width": "1280px",
                        "sm": "8px",
                        "2xl": "48px",
                        "sidebar-width": "260px",
                        "md": "16px",
                        "xl": "32px",
                        "unit": "4px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "code-md": ["JetBrains Mono"],
                        "display-lg": ["Inter"],
                        "code-sm": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Inter"],

                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "code-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "code-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.08em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Sub-surface grid pattern */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, theme('colors.outline-variant') 1px, transparent 1px),
                linear-gradient(to bottom, theme('colors.outline-variant') 1px, transparent 1px);
            background-size: 32px 32px;
            opacity: 0.1;
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        /* Glassmorphism panel base */
        .glass-panel {
            background-color: theme('colors.surface-glass');
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid theme('colors.outline-muted');
            border-right: 1px solid theme('colors.outline-muted');
            border-bottom: 1px solid theme('colors.outline-muted');
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Success bloom animation */
        @keyframes success-bloom {
            0% { transform: scale(0.8); opacity: 0; text-shadow: 0 0 0 theme('colors.success-vibrant'); }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 40px theme('colors.success-vibrant'); }
            100% { transform: scale(1); opacity: 1; text-shadow: 0 0 20px theme('colors.success-vibrant'); }
        }
        
        @keyframes fade-in-up {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .animate-bloom {
            animation: success-bloom 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.6s ease-out forwards;
            opacity: 0;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>
</head>
<body class="font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Background texture -->
<div class="bg-grid-pattern"></div>
<!-- Centered Success Overlay -->
<main class="relative z-10 w-full max-w-[640px] px-md md:px-xl">
<div class="glass-panel rounded-xl p-2xl flex flex-col items-center text-center animate-fade-in-up">
<!-- Success Icon -->
<div class="mb-lg relative flex items-center justify-center w-24 h-24">
<div class="absolute inset-0 bg-success-vibrant/20 rounded-full blur-xl animate-bloom"></div>
<span class="material-symbols-outlined text-[64px] text-success-vibrant animate-bloom relative z-10" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Typography Header -->
<h1 class="font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-on-surface mb-sm animate-fade-in-up delay-100">
                Milestone Unlocked
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl animate-fade-in-up delay-200 max-w-md mx-auto">
                Your primary workflow is now active. First intelligent task analyzed in <strong class="text-primary font-bold">12s</strong>.
            </p>
<!-- Metrics / Value Prop Bento -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-md mb-2xl animate-fade-in-up delay-200">
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-md flex flex-col items-start justify-center text-left">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-xs">Tokens Processed</span>
<span class="font-code-md text-code-md text-tertiary">14,204</span>
</div>
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-md flex flex-col items-start justify-center text-left">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-xs">Efficiency Gain</span>
<span class="font-code-md text-code-md text-success-vibrant">+42%</span>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col sm:flex-row gap-md justify-center animate-fade-in-up delay-300">
<button class="flex items-center justify-center gap-sm bg-transparent border border-outline-variant text-on-surface px-lg py-md rounded-lg font-body-md font-semibold hover:bg-surface-variant transition-colors scale-95 active:scale-90 w-full sm:w-auto">
<span class="material-symbols-outlined text-[20px]">
                        terminal
                    </span>
                    View Implementation Evidence
                </button>
<button class="flex items-center justify-center gap-sm bg-primary-container text-on-primary-container px-lg py-md rounded-lg font-body-md font-semibold hover:shadow-[0_0_15px_theme('colors.activation-glow')] transition-shadow scale-95 active:scale-90 w-full sm:w-auto relative overflow-hidden group">
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
<span class="material-symbols-outlined text-[20px] relative z-10" style="font-variation-settings: 'FILL' 1;">
                        rocket_launch
                    </span>
<span class="relative z-10">Launch Next Agent</span>
</button>
</div>
</div>
</main>
</body></html>
