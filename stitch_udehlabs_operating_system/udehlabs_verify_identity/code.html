<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>UdehLabs | Verify Identity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<style>

        }

            box-shadow: 0 0 15px -3px rgba(139, 92, 246, 0.3);
        }
        @keyframes subtle-glow {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.15; }
        }
        .ai-glow {
            animation: subtle-glow 4s ease-in-out infinite;
        }
    </style>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#004c6e",
                        "on-secondary-container": "#c4abff",
                        "primary-fixed": "#e2dfff",
                        "outline-variant": "#464555",
                        "on-secondary-fixed-variant": "#5516be",
                        "tertiary-fixed-dim": "#89ceff",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-primary": "#1d00a5",
                        "primary": "#c3c0ff",
                        "surface-bright": "#2a3a4f",
                        "surface": "#031427",
                        "surface-container-high": "#1b2b3f",
                        "secondary": "#d0bcff",
                        "surface-dim": "#031427",
                        "error": "#ffb4ab",
                        "inverse-surface": "#d3e4fe",
                        "primary-container": "#4f46e5",
                        "on-secondary": "#3c0091",
                        "surface-tint": "#c3c0ff",
                        "tertiary-container": "#006693",
                        "on-primary-container": "#dad7ff",
                        "on-surface-variant": "#c7c4d8",
                        "on-error-container": "#ffdad6",
                        "inverse-primary": "#4d44e3",
                        "inverse-on-surface": "#213145",
                        "tertiary": "#89ceff",
                        "on-surface": "#d3e4fe",
                        "outline": "#918fa1",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-variant": "#26364a",
                        "on-background": "#d3e4fe",
                        "secondary-container": "#571bc1",
                        "secondary-fixed": "#e9ddff",
                        "on-tertiary-fixed": "#001e2f",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#23005c",
                        "background": "#031427",
                        "error-container": "#93000a",
                        "surface-container-highest": "#26364a",
                        "on-tertiary-container": "#b8e0ff",
                        "surface-container": "#102034",
                        "surface-container-lowest": "#000f21",
                        "tertiary-fixed": "#c9e6ff",
                        "on-primary-fixed": "#0f0069",
                        "secondary-fixed-dim": "#d0bcff",
                        "on-tertiary": "#00344d",
                        "surface-container-low": "#0b1c30"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "md": "16px",
                        "sidebar_collapsed": "64px",
                        "sidebar_width": "260px",
                        "xl": "32px",
                        "max_content_width": "1440px",
                        "2xl": "48px",
                        "sm": "8px",
                        "base": "4px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "code-sm": ["JetBrains Mono"],
                        "label-caps": ["Inter"],
                        "display": ["Inter"],
                        "code-md": ["JetBrains Mono"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "code-sm": ["12px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "code-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]

                },
            },
        }

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Atmospheric Background -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">

<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent"></div>
</div>
<!-- Top Branding Anchor (Mimics TopAppBar but simplified for auth flow) -->
<header class="fixed top-0 left-0 w-full flex justify-center py-lg z-20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">terminal</span>
<h1 class="font-headline-md text-headline-md font-extrabold text-primary tracking-tight">UdehLabs</h1>
</div>
</header>
<!-- Main MFA Card -->
<main class="relative z-10 w-full max-w-[440px] px-md">
<div class="glass-panel p-xl rounded-xl border border-outline-variant shadow-2xl">
<div class="flex flex-col gap-sm mb-lg">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Two-factor authentication</h2>
<p class="font-body-md text-on-surface-variant">Enter the 6-digit code from your authenticator app to secure your account.</p>
</div>
<!-- Verification Method Toggle -->
<div class="flex bg-surface-container-low rounded-lg p-base mb-xl border border-outline-variant/30">
<button class="flex-1 flex items-center justify-center gap-2 py-2 rounded text-primary bg-primary-container/10 font-label-caps uppercase tracking-wider transition-all duration-200" id="btn-app">
<span class="material-symbols-outlined text-sm">smartphone</span>
                    App
                </button>
<button class="flex-1 flex items-center justify-center gap-2 py-2 rounded text-on-surface-variant hover:text-on-surface font-label-caps uppercase tracking-wider transition-all duration-200" id="btn-backup">
<span class="material-symbols-outlined text-sm">key</span>
                    Backup
                </button>
</div>
<!-- OTP Input Section -->
<form class="space-y-xl" id="mfa-form">
<div class="flex justify-between gap-2" id="otp-container">
<!-- Standard 6-digit inputs -->
<input class="otp-input w-12 h-14 bg-surface-container-high border border-outline-variant text-center text-headline-md font-code-md text-primary rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" data-index="0" maxlength="1" type="text">
<input class="otp-input w-12 h-14 bg-surface-container-high border border-outline-variant text-center text-headline-md font-code-md text-primary rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" data-index="1" maxlength="1" type="text">
<input class="otp-input w-12 h-14 bg-surface-container-high border border-outline-variant text-center text-headline-md font-code-md text-primary rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" data-index="2" maxlength="1" type="text">
<input class="otp-input w-12 h-14 bg-surface-container-high border border-outline-variant text-center text-headline-md font-code-md text-primary rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" data-index="3" maxlength="1" type="text">
<input class="otp-input w-12 h-14 bg-surface-container-high border border-outline-variant text-center text-headline-md font-code-md text-primary rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" data-index="4" maxlength="1" type="text">
<input class="otp-input w-12 h-14 bg-surface-container-high border border-outline-variant text-center text-headline-md font-code-md text-primary rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all" data-index="5" maxlength="1" type="text">
</div>
<!-- Backup code input (hidden by default) -->
<div class="hidden" id="backup-container">
<input class="w-full h-14 bg-surface-container-high border border-outline-variant px-md font-code-md text-primary rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all uppercase placeholder:text-outline/50" placeholder="XXXXX-XXXXX" type="text">
</div>
<button class="w-full bg-primary-container text-on-primary-container hover:bg-primary-container/90 py-md rounded-xl font-headline-md text-lg transition-all active:scale-[0.98] shadow-lg shadow-primary-container/20" type="submit">
                    Verify
                </button>
</form>
<div class="mt-xl flex flex-col gap-md items-center border-t border-outline-variant/30 pt-xl">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2 group">
<span class="material-symbols-outlined text-md group-hover:rotate-180 transition-transform duration-500">refresh</span>
<span class="font-label-caps uppercase">Resend Code</span>
</button>
<div class="flex gap-md text-xs text-outline font-label-caps">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="text-outline/30">•</span>
<a class="hover:text-primary transition-colors" href="#">Contact Support</a>
</div>
</div>
</div>
<!-- AI Assistant Status Indicator (Subtle) -->
<div class="mt-lg flex items-center justify-center gap-3 py-sm px-md bg-surface-container-lowest/50 backdrop-blur-sm rounded-full border border-outline-variant/20">
<div class="w-2 h-2 rounded-full bg-primary ai-glow"></div>
<span class="font-code-sm text-on-surface-variant text-[10px] tracking-widest uppercase">System: Secure Channel Active</span>
</div>
</main>
<!-- Visual Polish: Corner Decoration -->
<div class="fixed bottom-lg right-lg opacity-20 pointer-events-none">
<div class="relative w-32 h-32">
<div class="absolute inset-0 border-r border-b border-primary/40"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 bg-primary/10"></div>
</div>
</div>
<script>
        // Tab switching logic
        const btnApp = document.getElementById('btn-app');
        const btnBackup = document.getElementById('btn-backup');
        const otpContainer = document.getElementById('otp-container');
        const backupContainer = document.getElementById('backup-container');

        btnApp.addEventListener('click', () => {
            btnApp.classList.add('bg-primary-container/10', 'text-primary');
            btnBackup.classList.remove('bg-primary-container/10', 'text-primary');
            btnBackup.classList.add('text-on-surface-variant');
            otpContainer.classList.remove('hidden');
            otpContainer.classList.add('flex');
            backupContainer.classList.add('hidden');
        });

        btnBackup.addEventListener('click', () => {
            btnBackup.classList.add('bg-primary-container/10', 'text-primary');
            btnApp.classList.remove('bg-primary-container/10', 'text-primary');
            btnApp.classList.add('text-on-surface-variant');
            otpContainer.classList.add('hidden');
            otpContainer.classList.remove('flex');
            backupContainer.classList.remove('hidden');
        });

        // Auto-focus OTP fields
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple submission mock
        document.getElementById('mfa-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span>';
                btn.classList.remove('bg-primary-container');
                btn.classList.add('bg-secondary-container');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.add('bg-primary-container');
                    btn.classList.remove('bg-secondary-container');
                    btn.disabled = false;
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
